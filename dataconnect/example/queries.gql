mutation CreateUserData {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    displayName: "New User"
  })
}

mutation UpdateUserData($displayName: String) @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {displayName: $displayName})
}

mutation DeleteUserData @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    email
    displayName
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Public user directory") {
  users {
    displayName
    avatarUrl
  }
}

mutation CreateProject($title: String!, $description: String) @auth(level: USER) {
  project_insert(data: {
    title: $title,
    description: $description,
    ownerId_expr: "auth.uid"
  })
}

mutation UpdateProject($id: UUID!, $title: String) @auth(level: USER) {
  project_update(key: {id: $id}, data: {title: $title})
}

mutation DeleteProject($id: UUID!) @auth(level: USER) {
  project_delete(key: {id: $id})
}

query GetProject($id: UUID!) @auth(level: USER) {
  project(id: $id) {
    title
    owner { displayName }
  }
}

query ListProjects @auth(level: USER) {
  projects(where: {ownerId: {eq_expr: "auth.uid"}}) {
    title
    colorCode
  }
}

mutation CreateTask($title: String!, $projectId: UUID!) @auth(level: USER) {
  task_insert(data: {
    title: $title,
    status: "todo",
    projectId: $projectId
  })
}

mutation UpdateTask($id: UUID!, $status: String) @auth(level: USER) {
  task_update(key: {id: $id}, data: {status: $status})
}

mutation DeleteTask($id: UUID!) @auth(level: USER) {
  task_delete(key: {id: $id})
}

query GetTask($id: UUID!) @auth(level: USER) {
  task(id: $id) {
    title
    status
    dueDate
  }
}

query ListTasks($projectId: UUID!) @auth(level: USER) {
  tasks(where: {projectId: {eq: $projectId}}) {
    title
    priority
  }
}

mutation CreateTag($name: String!) @auth(level: USER) {
  tag_insert(data: {
    name: $name,
    userId_expr: "auth.uid"
  })
}

mutation UpdateTag($id: UUID!, $color: String) @auth(level: USER) {
  tag_update(key: {id: $id}, data: {color: $color})
}

mutation DeleteTag($id: UUID!) @auth(level: USER) {
  tag_delete(key: {id: $id})
}

query GetTag($id: UUID!) @auth(level: USER) {
  tag(id: $id) {
    name
    color
  }
}

query ListTags @auth(level: USER) {
  tags(where: {userId: {eq_expr: "auth.uid"}}) {
    name
    color
  }
}

mutation CreateTaskTag($taskId: UUID!, $tagId: UUID!) @auth(level: USER) {
  taskTag_insert(data: {taskId: $taskId, tagId: $tagId})
}

mutation DeleteTaskTag($taskId: UUID!, $tagId: UUID!) @auth(level: USER) {
  taskTag_delete(key: {taskId: $taskId, tagId: $tagId})
}

query GetTaskTag($taskId: UUID!, $tagId: UUID!) @auth(level: USER) {
  taskTag(key: {taskId: $taskId, tagId: $tagId}) {
    task { title }
    tag { name }
  }
}

query ListTaskTags @auth(level: USER) {
  taskTags {
    taskId
    tagId
  }
}